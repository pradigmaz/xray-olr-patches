ru=Кумулятивный хотфикс 3.1.6.3 (ревизия 1) для Oblivion Lost Remake 3.1.6 (12.11.2026).\n\nВключает все исправления предыдущих хотфиксов (3.1.6.1, 3.1.6.2) и обновления 3.1.6.3:\n- Исправлен вылет при входе в камеру хранения в Баре\n- Исправлен вылет при сохранении, когда вертолёт на Кордоне теряет цель\n- Исправлен вылет при переходе со Свалки на Кордон\n- Исправлен вылет и спам лога сторожевым таймером (Watchdog 97)\n- Исправлен вылет без лога по квесту Долга на отстрел крыс на Свалке\n- Исправлен вылет на статическом освещении (R1) при спасении командира на Ростоке и загрузке сохранений\n- Исправлен софтлок в колодце на Кордоне: увеличена дистанция срабатывания лестницы, выход отодвинут от края дыры\n- Тестовый фикс слепоты военных на Кордоне: дистанция тревоги патруля и реакция на мутантов\n- Отключена смена визуалов рук при смене костюмов\n- Убран тупиковый отказ отдавать артефакт технику у тепловоза\n- Правки ассортимента торговли у Сидоровича, Бармена и группировок\n- Тестовый фикс шейдеров\n- Устранены редкие вылеты при телекинезе бюрера, гибели сталкеров и ошибках системы отрисовки\n- Исправлен сброс настройки теней от солнца при перезапуске игры и загрузке сохранений\n- Исправлена ошибка, из-за которой Мессер мог погибнуть во время катсцен\n- Исправлено ошибочное срабатывание сообщения о защите тайника «Магнитом» на посторонние контейнеры\n- Восстановлена работа доски заданий в Баре\n- Добавлены уникальные постэффекты для болезней и их снятие при лечении\n- Уточнено условие ремонта транспорта в диалоге с барменом Крысой\n- Доработан туман войны: скорректирована прозрачность и устранено наслоение карты Ростка в Баре\n- Обновлены модели от первого лица и звуки перезарядки двустволки и обреза БМ-16\n- Добавлены бампы для расходников и прибора объединения артефактов\n- Исправлено некорректное отображение текста в части сообщений и меток на карте
[announcement]
text=Хотфикс 3 (3.1.6.3): камера хранения в Баре, вертолёт на Кордоне, переход Свалка-Кордон, Watchdog 97, статика R1 на Ростоке, колодец на Кордоне, тестовый ИИ военных, торговля и тестовые шейдеры.
