ru=Кумулятивный хотфикс 3.1.6.2 (ревизия 2) для Oblivion Lost Remake 3.1.6 (10.11.2026).\n\nВключает все исправления хотфикса 1 (3.1.6.1) и обновления 3.1.6.2:\n- Устранены редкие вылеты при телекинезе бюрера, гибели сталкеров и ошибках системы отрисовки\n- Исправлен сброс настройки теней от солнца при перезапуске игры и загрузке сохранений\n- Исправлена ошибка, из-за которой Мессер мог мгновенно погибнуть от жгучего пуха, амёбы и тумана, в том числе во время катсцен\n- Исправлено ошибочное срабатывание сообщения о защите тайника «Магнитом» на посторонние контейнеры\n- Восстановлена работа доски заданий в Баре\n- Добавлены уникальные постэффекты для болезней и их снятие при лечении, снижен порог появления эффектов лёгкой лучевой болезни\n- Отключена смена визуалов рук при смене костюмов для предотвращения сбоев и визуальных дефектов\n- Убран тупиковый вариант отказа отдавать артефакт в диалоге с механиком у тепловоза\n- Уточнено условие ремонта транспорта в диалоге с барменом Крысой: техник чинит только проданные им машины\n- Исправлена торговля артефактами у обычных сталкеров\n- Доработан туман войны: скорректирована прозрачность и устранено наслоение карты Ростка в Баре\n- Описание подзарядки детекторов батарейками перенесено в обучающие сообщения\n- Усилена прочность и стойкость к повреждениям у тюнингованной «Нивы»\n- Обновлены модели от первого лица и звуки перезарядки двустволки и обреза БМ-16\n- Добавлены бампы для расходников (аптечек, бинта, антирада) и прибора объединения артефактов\n- Исправлено некорректное отображение текста в части сообщений и меток на карте\n- Возвращены иконки Рихтера и обновлена иконка неизвестного отправителя в сообщениях\n- Обновлена иконка Мессера на глобальной карте\n- Незначительно скорректирована текстура перчаток куртки новичка
[announcement]
text=Хотфикс 2 (3.1.6.2, ревизия 2): визуалы рук, диалог с механиком, вылеты бюрера и рендера, тени от солнца, катсцены и пух, тайники с Магнитом, болезни, ремонт машин, торговля и туман войны.
