ru=Кумулятивный хотфикс 1 (3.1.5.1, Ревизия 3) для Oblivion Lost Remake 3.1.5. Исправление освещения на R2 (устранение темных объектов/регрессии света в помещениях и подземельях, корректная гамма hmodel), налобного фонаря, вылета при спавне (яmonsters) и восстановление 153 несжатых карт бампа (устранение «черных квадратов» на технике и объектах).
[announcement]
