ru=Кумулятивный хотфикс 3.1.4.3 для Oblivion Lost Remake 3.1.4 (08.10.2026). Пакет включает накопительные исправления: - Движок: устранён периодический сбой аллокатора памяти («bad node in heap») при загрузке сохранений и уровней. - Геймплей: исправлен сбой расчёта и отображения объёма рюкзака в инвентаре после загрузки игры. - Геймплей: устранена ошибка движка при экипировке и перемещении налобного фонарика («can't detach independant object»). - Версия: маркировка версии в главном меню и логе обновлена до 3.1.4.3.
