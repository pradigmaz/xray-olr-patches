ru=Кумулятивный хотфикс 3.1.6.1 для Oblivion Lost Remake 3.1.6 (07.11.2026).\n\n- Вылет при переходе на Медприбор (и со старых сейвов)\n- Исправлен скрипт Магнита, чтобы сталкеры не обносили тайники\n- Меньше мутантов в лаборатории под Радаром\n- Правки заданий и диалогов у Ника\n- Ремонт у механика в Баре\n- Правки машин\n- Фикс текстов, опечаток и биографий\n- Свет от ламп больше не проходит сквозь стены\n- Модель кровососа из 1580\n- Перчатки и бампы к ним: экзоскелет, наёмник, новичок, Стрелок\n- Бампы для светлого и второго контроллера\n- Фикс иконок заданий и иконок в сообщениях на экране
[announcement]
text=Хотфикс 1 (3.1.6.1): вылет на Медприбор, свет сквозь стены, скрипт Магнита, кровосос 1580, бампы перчаток и контроллера, квесты и тексты.
