[description]
ru=Кумулятивный хотфикс 3.1.6.4 (ревизия 1) для Oblivion Lost Remake 3.1.6 (14.11.2026).\n\nВключает все исправления предыдущих хотфиксов (3.1.6.1, 3.1.6.2, 3.1.6.3) и обновления 3.1.6.4:\n- Исправлен бросок гранаты с левой руки (граната больше не падает под ноги игрока)\n- Восстановлен бег/спринт с оружием (FN2000, РПГ-7, бинокль и всё остальное вооружение)\n- Исправлено залипание кнопки выбора предметов («шняги»)\n- Исправлено отображение худа рук/перчаток при смене костюмов\n- Обновлена панель телеметрии и график фреймтайма (rs_stats)\n- Исправлен софтлок в колодце на Кордоне: увеличена дистанция взаимодействия с лестницей, точка выхода отодвинута от люка\n- Восстановлен диалог фаст-тревела у проводника на Свалку\n- Добавлены новые визуалы мутантов (Корпус: обычный, в противогазе, сильный; кровосос) и контроллера от Влада\n- Добавлен прибор антирад-медприбор и специальная аптечка\n- Исправлено сообщение о пробуждении при сне у Жабы на Кордоне\n- Исправлен вылет при входе в камеру хранения в Баре\n- Исправлен вылет при сохранении, когда вертолёт на Кордоне теряет цель\n- Исправлен вылет со Свалки на Кордон при удалении партиклов\n- Исправлен вылет и спам лога сторожевым таймером (Watchdog 97)\n- Исправлен вылет без лога в квесте Долга на отстрел крыс на Свалке\n- Исправлен вылет на статике (R1) при спасении командира на Ростоке и загрузке сохранений\n- Тестовый фикс слепоты военных на Кордоне: дистанция тревоги патруля и реакция на мутантов\n- Убран тупиковый вариант диалога по артефакту с тепловоза\n- Скорректирован ассортимент торговли у Сидоровича, Бармена и группировок\n- Тестовый фикс шейдеров
[announcement]
text=Хотфикс 4 (3.1.6.4): бросок гранаты, спринт с оружием, кнопка шняги, визуал рук, rs_stats, колодец на Кордоне, проводник на Свалку, визуалы мутантов и контроллера, антирад-прибор.
