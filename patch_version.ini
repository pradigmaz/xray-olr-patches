ru=Кумулятивный хотфикс 3.1.6.6 для Oblivion Lost Remake 3.1.6 (21.11.2026).\n\nВключает все исправления предыдущих хотфиксов (3.1.6.1-3.1.6.5) и обновления 3.1.6.6:\n- Снижены микрофризы при выходе сталкеров в онлайн\n- Исправлен редкий сбой при сохранении игры во время активности симуляции\n- Исправлен сброс расширенных настроек видео при изменении параметров графики
[announcement]
text=Хотфикс 6 (3.1.6.6): снижение микрофризов при подгрузке сталкеров, стабильность сохранений, сохранение видеонастроек.
