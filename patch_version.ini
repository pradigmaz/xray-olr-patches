ru=Накопительный хотфикс 7 (ревизия 2) для Oblivion Lost Remake 3.1.4 (10.10.2026). Включает исправления хотфиксов 1-6 и устраняет: - Застревание квеста на поиск секретных документов (Документ №1 теперь корректно засчитывается, включая автозакрытие на старых сейвах). - Дублирование звука зарядки КПК при использовании батареек. - Отображение биографий сталкеров в КПК (возвращена плашка «см. профиль» вместо системного идентификатора). - Повторное воспроизведение сообщений эколога при повторном спуске в лабораторию Тёмной Долины. - Возвращён стабильный звуковой движок xrSound.
