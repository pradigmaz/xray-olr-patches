ru=Кумулятивный хотфикс 6 для Oblivion Lost Remake 3.1.4 (09.10.2026). Пакет включает все исправления хотфиксов 1, 2, 3, 4, 5 и свежие обновления: - Исправлен периодический фантомный звук системной ошибки, возникавший при обыске сталкерами тел погибших. - Исправлен стабильный вылет при загрузке сохранений на локации Светлый Луч. - Исправлена ошибка взаимодействия с доской заданий Жабы на локации Холмы (камера больше не улетает под землю с блокировкой управления).
