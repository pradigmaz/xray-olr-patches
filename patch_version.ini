ru=Кумулятивный хотфикс 2 (3.1.5.2) для Oblivion Lost Remake 3.1.5 (19.10.2026).\n\nКвесты и персонажи:\n- Кольбат переименован в Кобальта и возвращен в группировку «Чистое Небо».\n- Для текущих сохранений: чтобы сменить группировку Кобальта на дружественную («Чистое Небо»), поговорите с медиком в Баре о диагностике организма и ответьте «Обойдусь, пожалуй».\n- Фобос и группа ученых теперь корректно удаляются, если их квест не был выполнен до закрытия бункера на Янтаре.\n- Исключено ошибочное появление сообщений от Гацулы при пешем переходе на Росток, если ранее был выбран вариант с телепортом.\n- Исправлено обновление и сброс уникальных имен сталкеров.\n\nСнаряжение, визуалы и интерфейс:\n- Исправлена анимация и положение ружья Protecta на худе.\n- Добавлена смена текстур рук при заболеваниях Мессера.\n- Визуал худа рук больше не сбивается при переходе между локациями.\n- Обновлены линзы на шлемах комбинезона «СЕВА» и других защитных костюмах.\n- Исправлено описание защитного комбинезона Голмара.\n- Обновлены иконки экипировки и меток заданий.\n\nЗвук и исправления:\n- Включены недостающие звуки мутанта Корпус.\n- Восстановлены потерянные фоновые звуковые дорожки в Баре и на Генераторах.\n- Добавлена аварийная выгрузка текстур из памяти для защиты от вылетов (Out of Memory) при длительной игре.\n- Текстовые правки в диалогах и заметках.
[announcement]
text=Хотфикс 2 (3.1.5.2): фикс Протекты, линзы костюмов, визуал рук при болезнях, квесты Кобальта и Фобоса, звуки Корпуса, правки имен и текстов.
